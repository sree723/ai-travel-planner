<!DOCTYPE html>
<html>
<head>
<title>AI Travel Planner</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: 
      linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
      url("https://images.unsplash.com/1500530855697-b586d89ba3ee") no-repeat center center fixed;
    background-size: cover;
    color: white;
}
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.hero-box {
    background: rgba(0,0,0,0.7);
    padding: 40px;
    border-radius: 20px;
}
.hero-box h1 {
    font-size: 3em;
}
.hero-box p {
    font-size: 1.2em;
}
.button {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 30px;
    background: #00ffd5;
    color: black;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="hero">
    <div class="hero-box">
        <h1>🌍 Plan Smarter. Travel Better.</h1>
        <p>Your AI-powered travel assistant for routes, stays, and budgets.</p>
        <a href="/plan/" class="button">Start Planning</a>
    </div>
</div>

</body>
</html>
